name: Unity Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Vérifier le code source
      - name: Checkout repository
        uses: actions/checkout@v3

      # Étape 2 : Configurer Unity
      - name: Setup Unity
        uses: game-ci/unity-setup@v2
        with:
          unityVersion: 2021.3.0f1 # Remplace par la version de Unity utilisée dans ton projet

      # Étape 3 : Installer les dépendances
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libxrandr2 libxinerama1 libxcursor1 libnss3 xvfb

      # Étape 4 : Exécuter les tests
      - name: Run Unity Tests
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 640x480x24' \
          unity-editor -runTests -projectPath . -testResults results.xml -testPlatform playmode
        continue-on-error: true

      # Étape 5 : Publier les résultats des tests
      - name: Publish Test Results
        uses: actions/upload-artifact@v3
        with:
          name: Test Results
          path: results.xml
