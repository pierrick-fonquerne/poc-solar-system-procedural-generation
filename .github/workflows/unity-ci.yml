# Runs the Unity EditMode test suite with GameCI.
#
# Requires the following repository secrets (see
# https://game.ci/docs/github/activation for how to generate them):
#   - UNITY_LICENSE  (contents of the .ulf license file)
#   - UNITY_EMAIL    (Unity account email)
#   - UNITY_PASSWORD (Unity account password)
name: Unity CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run EditMode tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Unity Library folder is expensive to rebuild; cache it between runs
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # The Unity version is read automatically from ProjectSettings/ProjectVersion.txt
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          artifactsPath: test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
